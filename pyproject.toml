[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transparencia-es-rdf"
version = "0.1.0"
description = "Converte bases do Portal de Dados Abertos do ES para RDF"
requires-python = ">=3.11"
dependencies = [
    "pyshacl>=0.40",
    "rdflib>=7.0",
    "requests>=2.31",
]

[project.scripts]
transparencia-es-rdf = "transparencia_es_rdf.cli:main"
